# Runs the whole stack: docker compose up --build → http://localhost:4000
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tathkara
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ["4000:4000"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/tathkara
      JWT_SECRET: local-docker-jwt-secret-change-me-0123456789
      WEBHOOK_SECRET: local-docker-webhook-secret
      SEED_ON_START: "true"

volumes:
  pgdata:
