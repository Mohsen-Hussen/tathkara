# One-click deploy on Render: New → Blueprint → pick this repo.
# Secrets are generated by Render, so nothing sensitive lives in the repository.
services:
  - type: web
    name: tathkara
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tathkara-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: SEED_ON_START
        value: "true"

databases:
  - name: tathkara-db
    plan: free
    databaseName: tathkara
    user: tathkara
