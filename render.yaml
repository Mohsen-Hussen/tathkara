# One-click deploy on Render: New → Blueprint → pick this repo.
# The app runs on Render; the database is a free Neon Postgres (no 30-day expiry).
# Render asks for DATABASE_URL when the Blueprint is created and generates the other secrets,
# so nothing sensitive lives in the repository.
services:
  - type: web
    name: tathkara
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      # Neon's *direct* (non-pooled) connection string — pg-boss needs a session connection.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: SEED_ON_START
        value: "true"
